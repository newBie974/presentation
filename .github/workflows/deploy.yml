name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Astro check (TypeScript + diagnostics)
        run: npx astro check

      - name: Lint
        run: npx eslint "src/**/*.{js,ts,astro}"

      - name: Format check
        run: npx prettier --check "src/**/*.{astro,ts,css,md}"

      - name: Validate color contrast (WCAG AA)
        run: npm run validate:contrast

      - name: Build
        run: npm run build

      - name: Validate JSON-LD
        run: npm run validate:jsonld

      - name: Run axe-core (a11y)
        run: npx playwright test

      - name: Lighthouse CI
        run: npx lhci autorun

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
        with:
          # Pas de `timeout` ici : l'action le plafonne à 600000 ms (MAX_TIMEOUT,
          # src/internal/deployment.js). Toute valeur supérieure est ramenée au
          # max ET logge un warning à chaque run — l'ancien 1200000 ne donnait
          # donc aucune marge. Le seul levier réel contre le « Timeout reached »
          # de deux pushes qui se partagent le verrou (concurrency: pages) est la
          # tolérance aux erreurs de statut ci-dessous.
          error_count: 15
