name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Astro check (TypeScript + diagnostics)
        run: npx astro check

      - name: Lint
        run: npx eslint "src/**/*.{js,ts,astro}"

      - name: Format check
        run: npx prettier --check "src/**/*.{astro,ts,css,md}"

      - name: Validate color contrast (WCAG AA)
        run: npm run validate:contrast

      - name: Build
        run: npm run build

      - name: Validate JSON-LD
        run: npm run validate:jsonld

      - name: Run axe-core (a11y)
        run: npx playwright test

      - name: Lighthouse CI
        run: npx lhci autorun

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          # Laisse plus de marge à l'infra Pages (défaut 600000 = 10 min) : évite
          # le « Timeout reached, aborting! » quand deux pushes rapprochés se
          # partagent le verrou d'environnement (concurrency group: pages).
          timeout: 1200000
          error_count: 15
